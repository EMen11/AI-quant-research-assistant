[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-quant-research-assistant"
version = "0.1.0"
description = "Reproducible foundation for a trustworthy AI quantitative research workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.40,<1",
    "fonttools>=4.60,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pypdf>=6.1,<7",
    "python-dotenv>=1,<2",
    "reportlab>=4,<5",
    "scipy>=1.12,<2",
    "streamlit>=1.32,<2",
    "yfinance>=0.2.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quant"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
